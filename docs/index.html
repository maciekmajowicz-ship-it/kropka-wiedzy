<h1>kropka<span>.</span>wiedzy</h1>
<div id="k"></div>
<p>kropka.wiedzy to projekt publikujący krótkie ciekawostki i wiadomości na Instagramie i TikToku. Treści i filmy są tworzone automatycznie na podstawie publicznych źródeł, a następnie publikowane wyłącznie na koncie @kropka.wiedzy.</p>
<p><a href="regulamin.html">Regulamin</a> · <a href="prywatnosc.html">Polityka prywatności</a></p>
<script>
const q=new URLSearchParams(location.search),c=q.get("code"),e=q.get("error");
if(c)document.getElementById("k").innerHTML='<div class="kod"><b>Połączono z TikTokiem!</b><br>Skopiuj ten kod i wklej go Claude\u2019owi:<p id="c"></p><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Skopiowano ✓\'">Kopiuj kod</button></div>',document.getElementById("c").textContent=c;
else if(e)document.getElementById("k").innerHTML='<div class="kod">Błąd: '+e.replace(/</g,"")+'</div>';
</script></body></html>

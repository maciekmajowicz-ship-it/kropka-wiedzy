name: Publikowanie na Instagram i Facebook

on:
  schedule:
    # Ciekawostki o 7, 16 i 21 czasu polskiego. Cron jest w UTC, więc każda godzina
    # jest dwa razy (zima i lato) – skrypt sam sprawdza, czy to właściwa godzina w Polsce.
    - cron: "3 5,6,14,15,19,20 * * *"
  push:
    branches: [main]
    paths: [posts.json] # agent dopisał news -> robimy grafiki i publikujemy od razu
  workflow_dispatch: # ręczne uruchomienie z zakładki Actions (publikuje od razu ciekawostkę)

permissions:
  contents: write

concurrency:
  group: publikuj

jobs:
  publikuj:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/output
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja
        run: |
          npm ci
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Zdjęcia i grafiki dla nowych postów
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node pobierz_zdjecia.js
          node render.js
          git add output zdjecia/*.json
          git diff --cached --quiet || (git commit -m "Nowe grafiki" && git pull --rebase && git push)

      - name: Opublikuj
        run: |
          case "${{ github.event_name }}" in
            push)     node publikuj.js --newsy ;;
            schedule) node publikuj.js --auto ;;
            *)        node publikuj.js ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Filmy na TikToka (newsy, a w harmonogramie 1 ciekawostka)
        continue-on-error: true # błąd TikToka nie blokuje Instagrama
        env:
          CHROME_PATH: /usr/bin/google-chrome
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TRYB: ${{ vars.TIKTOK_TRYB }}
          GH_TOKEN: ${{ github.token }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          pip install -q edge-tts
          node tiktok/film.js
          if [ "${{ github.event_name }}" = "schedule" ]; then node tiktok/film.js --ciekawostki 1; fi
          node tiktok/do_pobrania.js
          node tiktok/publikuj_tiktok.js

      - name: Zapisz, co zostało opublikowane
        if: always()
        run: |
          git add opublikowane tiktok/wyslane docs/filmy.json
          git diff --cached --quiet || (git commit -m "Opublikowano" && git pull --rebase && git push)

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmy TikTok – kropka.wiedzy</title>
<style>body{font-family:system-ui,sans-serif;background:#0B0B10;color:#eee;max-width:560px;margin:0 auto;padding:20px 16px}
h1 span{color:#FF4D4D}.f{background:#1c1c25;border-radius:14px;padding:16px;margin:16px 0}.f.zr{opacity:.45}
.f h2{font-size:19px;margin:0 0 6px}.d{font-size:13px;opacity:.6;margin-bottom:10px}
video{width:100%;border-radius:10px;max-height:60vh;background:#000}
.b{display:flex;gap:10px;margin-top:12px}.b a,.b button{flex:1;text-align:center;font:700 17px system-ui;padding:14px;border-radius:10px;border:0;cursor:pointer;text-decoration:none}
.p{background:#C6FF3D;color:#111}.k{background:#FF4D4D;color:#fff}.z{background:#333;color:#eee}</style></head><body>
<h1>kropka<span>.</span>wiedzy – filmy</h1>
<p style="opacity:.7">1. Pobierz → 2. Kopiuj opis → 3. TikTok „+” → wybierz film → wklej opis → Opublikuj → 4. Oznacz jako wrzucony</p>
<div id="l">Ładowanie…</div>
<script>
const zr=()=>{try{return JSON.parse(localStorage.wrzucone||"[]")}catch{return[]}};
const ozn=(p)=>{try{const z=zr();z.includes(p)||z.push(p);localStorage.wrzucone=JSON.stringify(z)}catch{}pokaz()};
let L=[];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function pokaz(){const z=zr();document.getElementById("l").innerHTML=L.length?L.map((f,i)=>`<div class="f ${z.includes(f.plik)?"zr":""}">
<h2>${z.includes(f.plik)?"✓ ":""}${esc(f.tytul||f.plik)}</h2><div class="d">${new Date(f.data).toLocaleString("pl-PL")}</div>
<video src="${f.url}" controls preload="none" playsinline></video>
<div class="b"><a class="p" href="${f.url}" download>Pobierz</a><button class="k" onclick="navigator.clipboard.writeText(L[${i}].opis);this.textContent='Skopiowano ✓'">Kopiuj opis</button></div>
<div class="b"><button class="z" onclick="ozn('${f.plik}')">Oznacz jako wrzucony</button></div></div>`).join(""):"Brak filmów."}
fetch("filmy.json?"+Date.now()).then(r=>r.json()).then(j=>{L=j;pokaz()}).catch(()=>document.getElementById("l").textContent="Brak filmów.");
</script></body></html>
